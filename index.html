<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKRYPT-Security Operations Automation Portal</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --panel-bg: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --terminal-bg: #020617;
      --success: #10b981;
      --danger: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-border: #f59e0b;
      --warn-text: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    /* Left Drawer Form */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 998;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -440px;
      width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .drawer.open {
      left: 0;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group select option {
      background: #1e293b;
      color: #fff;
    }

    /* Output Console View */
    .output-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .output-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    /* Dedicated Copiable SOC Recommendation Box */
    .soc-rec-card {
      display: none;
      background: #161e2e;
      border: 1px solid var(--warn-border);
      border-left: 5px solid var(--warn-border);
      border-radius: 6px;
      padding: 18px;
      position: relative;
    }

    .soc-rec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .soc-rec-header h4 {
      color: var(--warn-text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .copy-btn:hover {
      background: #334155;
      border-color: #64748b;
    }

    .copy-btn.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    .soc-rec-content {
      font-size: 13.5px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      font-family: inherit;
    }

    /* Target Render Container for the Injected n8n HTML */
    #renderedReport {
      background: #ffffff;
      color: #111827;
      border-radius: 6px;
      padding: 24px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    #renderedReport:empty {
      display: none;
    }

    /* Modern Table Overrides for n8n HTML */
    #renderedReport h2 {
      font-size: 16px;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }
    #renderedReport table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 18px;
      font-size: 13px;
    }
    #renderedReport th {
      background: #f1f5f9;
      color: #475569;
      width: 220px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      text-align: left;
    }
    #renderedReport td {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      color: #1e293b;
    }

    /* Default Console View Prior to Ingestion */
    #statusPlaceholder {
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      color: #38bdf8;
      font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="drawer-overlay" id="overlay" onclick="toggleDrawer(false)"></div>

  <div class="container">
    <div class="header-bar">
      <div>
        <h2>MKRYPTED SOC BOT</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Input the entities, process and analyze</p>
      </div>
      <button class="btn-action" onclick="toggleDrawer(true)">Initiate</button>
    </div>

    <!-- Output Section -->
    <div class="output-card">
      <div class="output-card-header">
        <h3>Investigation Report</h3>
        <span class="badge" id="statusBadge">Idle</span>
      </div>

      <!-- Copiable SOC Recommendations Panel -->
      <div class="soc-rec-card" id="socRecCard">
        <div class="soc-rec-header">
          <h4>SOC TRIAGE RECOMMENDATION</h4>
          <button class="copy-btn" id="copyRecBtn" onclick="copyRecommendations()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>Copy Recommendation</span>
          </button>
        </div>
        <div class="soc-rec-content" id="socRecContent"></div>
      </div>

      <!-- Dynamic HTML Render Target -->
      <div id="renderedReport"></div>

      <!-- Pre-submission Console Status Placeholder -->
      <div id="statusPlaceholder">// Click "Initiate" to trigger the workflow...</div>
    </div>
  </div>

  <!-- Left Side Slide-Out Form Drawer -->
  <aside class="drawer" id="formDrawer">
    <div class="drawer-head">
      <h3>Test Form</h3>
      <button class="close-btn" onclick="toggleDrawer(false)">&times;</button>
    </div>

    <form id="investigationForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="alertName">Alert Name</label>
        <select id="alertName" required>
          <option value="" disabled selected>Select an option ...</option>
          <option value="Initial Access">Initial Access</option>
          <option value="Reconnaisance">Reconnaisance</option>
          <option value="Privilege Escalation">Privilege Escalation</option>
          <option value="Exfiltration or Infiltration">Exfiltration or Infiltration</option>
          <option value="Command and Control">Command and Control</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ipAddress">IPAddress</label>
        <input type="text" id="ipAddress" placeholder="e.g. 44.44.55.55" required />
      </div>

      <div class="form-group">
        <label for="clientTool">Client Tool</label>
        <select id="clientTool" required>
          <option value="" disabled selected>Select an option ...</option>
          <option value="Sentinel">Sentinel</option>
          <option value="dot6">dot6</option>
          <option value="dot9">dot9</option>
          <option value="dot58">dot58</option>
          <option value="secops">secops</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rawData">Raw Data</label>
        <input type="text" id="rawData" placeholder="e.g. 2323" required />
      </div>

      <div class="form-group">
        <label for="submittedAt">Submitted At (Auto-generated)</label>
        <input type="text" id="submittedAt" readonly style="opacity: 0.8; font-size: 12px;" />
      </div>

      <button type="submit" class="btn-action" id="submitBtn" style="width: 100%; margin-top: 15px;">
        Post to Automation
      </button>
    </form>
  </aside>

  <script>
    const N8N_WEBHOOK_URL = "https://securemkrypt1.app.n8n.cloud/webhook/08edd347-92b9-4359-a035-59cd06d478c7";

    function getLocalIsoTimestamp() {
      const now = new Date();
      const pad = (n, len = 2) => String(n).padStart(len, '0');
      const year = now.getFullYear();
      const month = pad(now.getMonth() + 1);
      const day = pad(now.getDate());
      const hours = pad(now.getHours());
      const mins = pad(now.getMinutes());
      const secs = pad(now.getSeconds());
      const ms = pad(now.getMilliseconds(), 3);
      
      const tzOffset = -now.getTimezoneOffset();
      const tzSign = tzOffset >= 0 ? '+' : '-';
      const tzHours = pad(Math.floor(Math.abs(tzOffset) / 60));
      const tzMins = pad(Math.abs(tzOffset) % 60);

      return `${year}-${month}-${day}T${hours}:${mins}:${secs}.${ms}${tzSign}${tzHours}:${tzMins}`;
    }

    function toggleDrawer(open) {
      if (open) {
        document.getElementById("submittedAt").value = getLocalIsoTimestamp();
      }
      document.getElementById("formDrawer").classList.toggle("open", open);
      document.getElementById("overlay").classList.toggle("active", open);
    }

    async function handleFormSubmit(event) {
      event.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const statusBadge = document.getElementById("statusBadge");
      const statusPlaceholder = document.getElementById("statusPlaceholder");
      const renderedContainer = document.getElementById("renderedReport");
      const socRecCard = document.getElementById("socRecCard");

      const payload = {
        "Alert Name": document.getElementById("alertName").value,
        "Raw Data": document.getElementById("rawData").value.trim(),
        "IPAddress": document.getElementById("ipAddress").value.trim(),
        "Client Tool": document.getElementById("clientTool").value,
        "submittedAt": document.getElementById("submittedAt").value || getLocalIsoTimestamp()
      };

      toggleDrawer(false);

      submitBtn.disabled = true;
      statusBadge.className = "badge active";
      statusPlaceholder.style.display = "block";
      renderedContainer.innerHTML = "";
      socRecCard.style.display = "none";

      let secondsLeft = 10;
      statusPlaceholder.textContent = `[*] Payload dispatched:\n${JSON.stringify(payload, null, 2)}\n\n[*] Waiting ${secondsLeft}s for pipeline enrichment and model analysis...`;
      statusBadge.textContent = `Processing (${secondsLeft}s)`;

      const timer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          statusPlaceholder.textContent = `[*] Payload dispatched:\n${JSON.stringify(payload, null, 2)}\n\n[*] Waiting ${secondsLeft}s for pipeline enrichment and model analysis...`;
          statusBadge.textContent = `Processing (${secondsLeft}s)`;
        } else {
          clearInterval(timer);
          statusPlaceholder.textContent = `[*] Retrieving rendered investigation template ...`;
          statusBadge.textContent = "Fetching...";
        }
      }, 1000);

      await new Promise(res => setTimeout(res, 5000));

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        // Extract raw HTML from array or object wrapping
        let rawHtml = "";
        if (Array.isArray(result) && result[0]?.html) {
          rawHtml = result[0].html;
        } else if (result?.html) {
          rawHtml = result.html;
        } else if (result?.body?.[0]?.html) {
          rawHtml = result.body[0].html;
        } else if (typeof result === "string") {
          rawHtml = result;
        }

        if (rawHtml) {
          statusPlaceholder.style.display = "none";
          renderedContainer.innerHTML = rawHtml;

          // Extract recommendation content (.rec) into copiable header card
          const recElement = renderedContainer.querySelector(".rec");
          if (recElement) {
            const recText = recElement.innerText.trim();
            document.getElementById("socRecContent").textContent = recText;
            socRecCard.style.display = "block";
            // Remove duplicate original inline rec block from bottom table
            recElement.remove();
          }

          statusBadge.className = "badge active";
          statusBadge.textContent = "Completed (200 OK)";
        } else {
          statusPlaceholder.textContent = JSON.stringify(result, null, 2);
        }

      } catch (err) {
        statusBadge.className = "badge error";
        statusBadge.textContent = "Failed";
        statusPlaceholder.textContent = `[!] Error communicating with n8n Webhook:\n${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function copyRecommendations() {
      const text = document.getElementById("socRecContent").innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyRecBtn");
        const span = btn.querySelector("span");
        btn.classList.add("copied");
        span.textContent = "Copied to Clipboard!";
        setTimeout(() => {
          btn.classList.remove("copied");
          span.textContent = "Copy Recommendation";
        }, 2000);
      });
    }
  </script>
</body>
</html>
