<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Operations Automation Portal</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --panel-bg: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --terminal-bg: #020617;
      --terminal-text: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    /* Left Drawer Form */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 998;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -440px;
      width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .drawer.open {
      left: 0;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group select option {
      background: #1e293b;
      color: #fff;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    /* Output Console */
    .output-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .output-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    pre#jsonOutput {
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px;
      color: var(--terminal-text);
      font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 280px;
      max-height: 520px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="drawer-overlay" id="overlay" onclick="toggleDrawer(false)"></div>

  <div class="container">
    <div class="header-bar">
      <div>
        <h2>Security Investigation Automation</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Trigger n8n webhook with SOC incident parameters and stream consolidated JSON</p>
      </div>
      <button class="btn-action" onclick="toggleDrawer(true)">Initiate</button>
    </div>

    <div class="output-card">
      <div class="output-card-header">
        <h3>Consolidated Output Stream</h3>
        <span class="badge" id="statusBadge">Idle</span>
      </div>
      <pre id="jsonOutput">// Click "Initiate" to fill and post the incident parameters...</pre>
    </div>
  </div>

  <!-- Left Side Slide-Out Form Drawer -->
  <aside class="drawer" id="formDrawer">
    <div class="drawer-head">
      <h3>Test Form</h3>
      <button class="close-btn" onclick="toggleDrawer(false)">&times;</button>
    </div>

    <form id="investigationForm" onsubmit="handleFormSubmit(event)">
      <!-- Alert Name Dropdown -->
      <div class="form-group">
        <label for="alertName">Alert Name</label>
        <select id="alertName" required>
          <option value="" disabled selected>Select an option ...</option>
          <option value="Initial Access">Initial Access</option>
          <option value="Reconnaisance">Reconnaisance</option>
          <option value="Privilege Escalation">Privilege Escalation</option>
          <option value="Exfiltration or Infiltration">Exfiltration or Infiltration</option>
          <option value="Command and Control">Command and Control</option>
        </select>
      </div>

      <!-- IP Address -->
      <div class="form-group">
        <label for="ipAddress">IP Address</label>
        <input type="text" id="ipAddress" placeholder="e.g. 44.44.55.55" required />
      </div>

      <!-- Client Tool Dropdown -->
      <div class="form-group">
        <label for="clientTool">Client Tool</label>
        <select id="clientTool" required>
          <option value="" disabled selected>Select an option ...</option>
          <option value="Sentinel">Sentinel</option>
          <option value="dot6">dot6</option>
          <option value="dot9">dot9</option>
          <option value="dot58">dot58</option>
          <option value="secops">secops</option>
        </select>
      </div>

      <!-- Raw Data -->
      <div class="form-group">
        <label for="rawData">Raw Data</label>
        <input type="text" id="rawData" placeholder="e.g. 2323" required />
      </div>

      <!-- Auto-Generated SubmittedAt Timestamp -->
      <div class="form-group">
        <label for="submittedAt">Submitted At (Auto-generated)</label>
        <input type="text" id="submittedAt" readonly style="opacity: 0.8; font-size: 12px;" />
      </div>

      <button type="submit" class="btn-action" id="submitBtn" style="width: 100%; margin-top: 15px;">
        Post to n8n Automation
      </button>
    </form>
  </aside>

  <script>
    const N8N_WEBHOOK_URL = "https://securemkrypt1.app.n8n.cloud/webhook/08edd347-92b9-4359-a035-59cd06d478c7";

    function getLocalIsoTimestamp() {
      const now = new Date();
      const pad = (n, len = 2) => String(n).padStart(len, '0');
      const year = now.getFullYear();
      const month = pad(now.getMonth() + 1);
      const day = pad(now.getDate());
      const hours = pad(now.getHours());
      const mins = pad(now.getMinutes());
      const secs = pad(now.getSeconds());
      const ms = pad(now.getMilliseconds(), 3);
      
      const tzOffset = -now.getTimezoneOffset();
      const tzSign = tzOffset >= 0 ? '+' : '-';
      const tzHours = pad(Math.floor(Math.abs(tzOffset) / 60));
      const tzMins = pad(Math.abs(tzOffset) % 60);

      return `${year}-${month}-${day}T${hours}:${mins}:${secs}.${ms}${tzSign}${tzHours}:${tzMins}`;
    }

    function toggleDrawer(open) {
      if (open) {
        document.getElementById("submittedAt").value = getLocalIsoTimestamp();
      }
      document.getElementById("formDrawer").classList.toggle("open", open);
      document.getElementById("overlay").classList.toggle("active", open);
    }

    async function handleFormSubmit(event) {
      event.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const statusBadge = document.getElementById("statusBadge");
      const outputArea = document.getElementById("jsonOutput");

      const payload = {
        "Alert Name": document.getElementById("alertName").value,
        "Raw Data": document.getElementById("rawData").value.trim(),
        "IPAddress": document.getElementById("ipAddress").value.trim(),
        "Client Tool": document.getElementById("clientTool").value,
        "submittedAt": document.getElementById("submittedAt").value || getLocalIsoTimestamp()
      };

      toggleDrawer(false);

      submitBtn.disabled = true;
      statusBadge.className = "badge active";

      let secondsLeft = 10;
      outputArea.textContent = `[*] Payload dispatched:\n${JSON.stringify(payload, null, 2)}\n\n[*] Waiting ${secondsLeft}s for pipeline enrichment and model verdict...`;
      statusBadge.textContent = `Processing (${secondsLeft}s)`;

      const timer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          outputArea.textContent = `[*] Payload dispatched:\n${JSON.stringify(payload, null, 2)}\n\n[*] Waiting ${secondsLeft}s for pipeline enrichment and model verdict...`;
          statusBadge.textContent = `Processing (${secondsLeft}s)`;
        } else {
          clearInterval(timer);
          outputArea.textContent = `[*] 5 seconds elapsed. Fetching consolidated data from n8n pipeline...`;
          statusBadge.textContent = "Fetching...";
        }
      }, 1000);

      await new Promise(res => setTimeout(res, 5000));

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
        }

        const consolidatedData = await response.json();

        statusBadge.className = "badge active";
        statusBadge.textContent = "Completed (200 OK)";
        outputArea.textContent = JSON.stringify(consolidatedData, null, 2);

      } catch (err) {
        statusBadge.className = "badge error";
        statusBadge.textContent = "Failed";
        outputArea.textContent = `[!] Error communicating with n8n Webhook:\n${err.message}\n\nTroubleshooting tips:\n1. Ensure your workflow in n8n is toggled ACTIVE in the top right.\n2. Confirm the final node is 'Respond to Webhook' returning {{ $json }}.`;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
